; PlatformIO Project Configuration — SHC Edge Node (ESP32 + LD2410C)
; บอร์ดเป้าหมาย: esp32dev (ESP32 DevKit V1 / WROOM-32)
; ห้ามใส่ credential จริงในไฟล์นี้ — ใช้ include/config.h (gitignored)

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

; LD2410C ใช้ HardwareSerial2 (UART2) — baud 256000 8N1 (ค่าเริ่มต้นโรงงาน; ห้ามเปลี่ยน)
; สเปก: doc/raw/hardware_specs/hlk_ld2410c_uart_protocol_v1.07.md
; RX=GPIO16 (จาก Tx โมดูล), TX=GPIO17 (ไป Rx โมดูล)
build_flags =
    -D LD2410C_BAUD=256000
    -D LD2410_RX_PIN=16
    -D LD2410_TX_PIN=17
    -D DOOR_SENSOR_PIN=27

lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.0

; ไฟล์ config.h จะถูก copy จาก config.example.h ครั้งแรก (ดู README)
