# ==============================================================================
# Mosquitto Broker Configuration — Hotel ECS (Smart Check-in)
# Auth (username/password) + TLS สำหรับ Cloud-to-Edge MQTT Bridge
#
# ติดตั้งโดย: ops/mosquitto/setup-auth-tls.ps1 (ต้องรันแบบ Administrator)
# อ้างอิง:   doc/wiki/mqtt_sse_cloud_edge_bridge.md
# ==============================================================================

# ─── Global Security (ใช้กับทุก listener) ─────────────────────────────────────

# บังคับ Authentication ทุกการเชื่อมต่อ (ปิด anonymous)
allow_anonymous false

# ไฟล์ username/password (สร้างด้วย mosquitto_passwd)
password_file C:\Program Files\Mosquitto\pwfile

# ─── Listener 1: MQTT ปกติ (พอร์ต 1883) — สำหรับ LAN / ภายใน ─────────────────
# 0.0.0.0 = เปิดรับทุก interface (เพื่อให้ Raspberry Pi ใน LAN เชื่อมต่อได้)
listener 1883 0.0.0.0

# ─── Listener 2: MQTT over TLS (พอร์ต 8883) — สำหรับ Internet / ปลอดภัย ──────
listener 8883 0.0.0.0
certfile C:\Program Files\Mosquitto\certs\server.crt
keyfile  C:\Program Files\Mosquitto\certs\server.key

# ─── Persistence (QoS 1/2 + retained messages) ───────────────────────────────
persistence true
persistence_location C:\Program Files\Mosquitto\data\

# ─── Logging ──────────────────────────────────────────────────────────────────
log_dest file C:\Program Files\Mosquitto\mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
